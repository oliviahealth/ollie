services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ollie
      POSTGRES_USER: ollie
      POSTGRES_PASSWORD: ollie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollie -d ollie"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build: ./
    env_file:
      - .env
    volumes:
      - ./data/location_rows.csv:/seed/location_rows.csv:ro
      - ./data/langchain_pg_collection_rows.csv:/seed/langchain_pg_collection_rows.csv:ro
      - ./data/langchain_pg_embedding_rows.csv:/seed/langchain_pg_embedding_rows.csv:ro
      - ./data/local_resource_rows.csv:/seed/local_resource_rows.csv:ro
      - ./data/video_spotlight_rows.csv:/seed/video_spotlight_rows.csv:ro
      - ./data/quick_tip_rows.csv:/seed/quick_tip_rows.csv:ro
      - ./data/infographic_rows.csv:/seed/infographic_rows.csv:ro
      - ./data/island_rows.csv:/seed/island_rows.csv:ro
      - ./packages/flask-admin:/deps/flask-admin
    command: >
      sh -c "pip uninstall -y flask-admin || true &&
             pip install --no-deps -e /deps/flask-admin &&
             python init_app.py"
    restart: "no"

  server:
    build: ./
    env_file:
      - .env
    ports:
      - "5050:5050"
    depends_on:
      init:
        condition: service_completed_successfully
    develop:
      watch:
        - path: .
          action: sync+restart
          target: /app
        - path: ./packages/flask-admin
          action: rebuild
        - path: ./requirements.txt
          action: rebuild

volumes:
  pgdata: