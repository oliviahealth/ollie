services:
  init:
    build: ./
    env_file:
      - .env
    
    volumes:
      - ./data/location_rows.csv:/seed/location_rows.csv:ro
      - ./data/langchain_pg_collection_rows.csv:/seed/langchain_pg_collection_rows.csv:ro
      - ./data/langchain_pg_embedding_rows.csv:/seed/langchain_pg_embedding_rows.csv:ro
    command: ["python", "init_app.py"]
    restart: "no"

  server:
    build: ./
    env_file:
      - .env
    ports:
      - "5050:5050"
    depends_on:
      init:
        condition: service_completed_successfully
    develop:
      watch:
        # If your app code lives elsewhere, change ./ to the right folder (e.g., ./app)
        - path: .
          action: sync+restart
          target: /app
        # If requirements change, rebuild
        - path: ./requirements.txt
          action: rebuild

volumes:
  pgdata:
